services:
  - type: web
    name: nimbus-cloud-storage
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run db:push && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nimbus-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: nimbus-db
    databaseName: nimbus
    user: nimbus_user
    plan: free
